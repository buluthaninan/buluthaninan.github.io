name: Deploy to GitHub Pages

# Bu dosya depoya push edildikten sonra calisir. Once GitHub'da:
#   Settings > Pages > Build and deployment > Source: "GitHub Actions"
#
# Depo adi `buluthaninan.github.io` ise BASE_PATH bos kalmali (varsayilan).
# Baska bir depo adi kullanirsan asagidaki BASE_PATH satirini ac ve depo adini yaz.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # BASE_PATH: /depo-adi
          NODE_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
